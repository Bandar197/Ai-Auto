name: iOS

# Runs on macOS 26 with the latest stable Xcode: plugins use iOS 26 SDK APIs and App Store
# uploads must be built with the current SDK.
# 1. "build" compiles the iOS app without signing on every change to mobile/ (proves it builds).
# 2. "testflight" signs and uploads to TestFlight. It runs only when you start it by hand
#    (Actions → iOS → Run workflow → upload_testflight = true) and the Apple secrets are set.
#    Required repository secrets (Settings → Secrets and variables → Actions):
#      APPLE_TEAM_ID   — 10-character Team ID (developer.apple.com → Membership)
#      ASC_KEY_ID      — App Store Connect API key ID (Users and Access → Integrations → Keys, role App Manager)
#      ASC_ISSUER_ID   — Issuer ID shown on the same page
#      ASC_KEY_P8      — full text of the downloaded AuthKey_XXXX.p8 file
#    The app record (bundle id ai.automind.app) must exist in App Store Connect first. See docs/IOS.md.

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Sign and upload the build to TestFlight"
        type: boolean
        default: false
  pull_request:
    paths: ["mobile/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS build (no signing)
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable  # current iOS SDK (required by plugins and by App Store uploads)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  testflight:
    name: Upload to TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check Apple secrets
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/IOS.md)"; exit 1
          fi
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable  # current iOS SDK (required by plugins and by App Store uploads)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
      - run: flutter pub get
      - name: Prepare Flutter iOS build (version from pubspec, build number = run number)
        run: flutter build ios --release --no-codesign --build-number "${{ github.run_number }}"
      - name: Archive (automatic signing via API key)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic
      - name: Export and upload to TestFlight
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
