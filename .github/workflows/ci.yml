name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared data (KB + scenarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/validate_kb.py shared/kb/dtc_definitions.json shared/obd/pids.json
      - run: python3 tools/validate_modules.py shared/obd/modules.json
      - run: python3 tools/validate_controllers.py shared/diag/controller_identifiers.json

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTOMIND_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/automind_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,llm]"
      - run: ruff check .
      - run: pytest -q --cov=automind --cov-report=term-missing:skip-covered

  web:
    name: Admin web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile (analyze + test + APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Release signing key (only when the repository secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set: the APK is signed with the debug key (testing only). See docs/ANDROID_RELEASE.md."
          fi
      - name: Release APK (obfuscated)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols/android
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v5
        with:
          name: automind-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v5
        with:
          name: automind-android-symbols
          path: mobile/build/symbols/android/
          retention-days: 90

  windows-app:
    name: Windows app (desktop build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --obfuscate --split-debug-info=build/symbols/windows
      - name: Bundle the Visual C++ runtime so the app runs on any Windows PC
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" $out -ErrorAction Stop
          }
          Get-ChildItem $out | Select-Object Name, Length
      - uses: actions/upload-artifact@v5
        with:
          name: automind-windows
          path: mobile/build/windows/x64/runner/Release/
      - name: Microsoft Store package (MSIX, signed by the Store on upload)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $msixArgs = @("run", "msix:create", "--version", "1.0.${{ github.run_number }}.0", "--output-path", "build/msix", "--output-name", "AutoMindAI")
          if ($env:MSIX_IDENTITY_NAME) { $msixArgs += @("--identity-name", $env:MSIX_IDENTITY_NAME) }
          if ($env:MSIX_PUBLISHER) { $msixArgs += @("--publisher", $env:MSIX_PUBLISHER) }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $msixArgs += @("--publisher-display-name", $env:MSIX_PUBLISHER_DISPLAY_NAME) }
          dart @msixArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build/msix | Select-Object Name, Length
      - uses: actions/upload-artifact@v5
        with:
          name: automind-windows-store
          path: mobile/build/msix/AutoMindAI.msix
      - uses: actions/upload-artifact@v5
        with:
          name: automind-windows-symbols
          path: mobile/build/symbols/windows/
          retention-days: 90
