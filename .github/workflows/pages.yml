name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['platform/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy shared engine into the site
        run: cp platform/shared/engine.js platform/site/engine.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: platform/site
      - id: deployment
        uses: actions/deploy-pages@v4
