[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automind"
version = "0.1.0"
description = "AutoMind AI — OBD-II connectivity, ECU simulator, diagnosis engine and API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.158,<1",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "asyncpg>=0.32",
  "argon2-cffi>=25.1",
  "pyjwt>=2.15",
  "cryptography>=46",
  "pyotp>=2.9",
  "redis>=8.1",
  "jinja2>=3.1",
  "httpx>=0.28",
]

[project.optional-dependencies]
ble = ["bleak>=3.0"]
serial = ["pyserial>=3.5"]
llm = ["anthropic>=2.0"]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.0",
  "ruff>=0.14",
  "jsonschema>=4.25",
]

[project.scripts]
automind = "automind.cli:main"

[tool.setuptools.packages.find]
include = ["automind*"]

[tool.setuptools.package-data]
"automind.reports" = ["templates/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "db: needs a PostgreSQL database (AUTOMIND_TEST_DATABASE_URL)",
  "hardware: needs a real ELM327 adapter (AUTOMIND_HW_HOST)",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S311", "B008", "ASYNC109"]  # ASYNC109: explicit OBD command timeouts are intended

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
# Bilingual (Arabic/English) diagnostic text is kept on one line per message for reviewability.
"automind/diagnosis/rules/*.py" = ["E501"]
"automind/diagnosis/engine.py" = ["E501"]
"automind/diagnosis/llm.py" = ["E501"]
"automind/reports/__init__.py" = ["E501"]
