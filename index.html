<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>بلوت المجلس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen majlis table. HUD strip on top, green felt with four seats and a centre trick spot, your hand along the bottom edge. Single deliberate night look. */
:root{
  color-scheme: dark;
  --felt:#0e3a2d; --felt-deep:#082219; --felt-line:#245e4a;
  --brass:#d9ac52; --brass-deep:#9c7632;
  --ivory:#f7f0e1; --ink:#1c1915; --suit-red:#b8261d;
  --sadu-a:#7a1f26; --sadu-b:#2a0d10;
  --panel:#0b261e; --panel-2:#113428; --line:#2c6150;
  --text:#efe7d5; --muted:#a3b7ab;
  --us:#6fd09a; --them:#ec7b6c;
  --f-display:"Reem Kufi","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-card:Georgia,"Times New Roman",serif;
  --cw:clamp(50px,9.6vmin,90px);
  --ch:calc(var(--cw)*1.42);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--felt-deep);color:var(--text);font-family:var(--f-body);font-size:15px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;max-width:1100px;margin:0 auto;position:relative}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.score{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.score .team{display:flex;flex-direction:column;align-items:center;min-width:52px}
.score .team b{font-family:var(--f-display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.score .team small{font-size:11px;color:var(--muted);letter-spacing:.04em}
.score .us b{color:var(--us)} .score .them b{color:var(--them)}
.score .sep{width:1px;align-self:stretch;background:var(--line)}
.score .bar{width:64px;height:4px;border-radius:2px;background:var(--felt-line);overflow:hidden;margin-top:3px}
.score .bar i{display:block;height:100%}
.score .us .bar i{background:var(--us)} .score .them .bar i{background:var(--them)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip .s{font-size:17px;line-height:1}
.chip.red .s{color:#ff8a7e}
.chip .x2{background:var(--brass);color:var(--ink);border-radius:6px;padding:0 6px;font-weight:700}
.abnat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-inline-start:auto}
.tbtn{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.tbtn:hover{border-color:var(--brass)}
.tbtn.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.tbtn[disabled]{opacity:.4;cursor:default}

/* Table */
.table{position:relative;flex:1;min-height:0;border-radius:28px;
  background:radial-gradient(ellipse at 50% 45%, #17513f 0%, var(--felt) 55%, #0a2c22 100%);
  box-shadow:inset 0 0 0 6px var(--sadu-b), inset 0 0 0 9px var(--brass-deep), inset 0 0 60px rgba(0,0,0,.55);overflow:hidden}
.table::before{content:"";position:absolute;inset:14px;border-radius:20px;border:1px dashed rgba(217,172,82,.18);pointer-events:none}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:3}
.seat[data-p="1"]{right:14px;top:42%;transform:translateY(-50%)}
.seat[data-p="2"]{top:12px;left:50%;transform:translateX(-50%)}
.seat[data-p="3"]{left:14px;top:42%;transform:translateY(-50%)}
.seat[data-p="0"]{bottom:calc(var(--ch)*0.95 + 18px);right:18px}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:19px;
  background:var(--panel);border:2px solid var(--line);transition:box-shadow .25s,border-color .25s}
.seat.ally .avatar{border-color:#3d8f68} .seat.foe .avatar{border-color:#8f4a40}
.seat.turn .avatar{border-color:var(--brass);box-shadow:0 0 0 4px rgba(217,172,82,.25),0 0 22px rgba(217,172,82,.5)}
.pname{font-size:12px;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px;white-space:nowrap}
.tags{display:flex;gap:4px;min-height:18px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--brass);color:var(--ink);font-weight:700}
.tag.d{background:var(--ivory)}
.backs{display:flex;height:calc(var(--ch)*0.42)}
.backs .mini{width:calc(var(--cw)*0.3);height:calc(var(--ch)*0.42);border-radius:4px;margin-inline-start:calc(var(--cw)*-0.18);
  background:repeating-linear-gradient(45deg,var(--sadu-a) 0 5px,var(--sadu-b) 5px 10px);border:1px solid var(--brass-deep)}
.backs .mini:first-child{margin-inline-start:0}
.bubble{position:absolute;top:-6px;white-space:nowrap;background:var(--ivory);color:var(--ink);font-weight:700;font-family:var(--f-display);
  padding:4px 12px;border-radius:14px;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(6px) scale(.9);transition:.2s;pointer-events:none;z-index:9}
.bubble.show{opacity:1;transform:translateY(-100%) scale(1)}
.bubble.proj{background:var(--brass)}
.seat[data-p="1"] .bubble{right:0} .seat[data-p="3"] .bubble{left:0}

/* Cards */
.card{width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*0.09);background:linear-gradient(160deg,#fffaf0,var(--ivory));
  color:var(--ink);position:relative;box-shadow:0 2px 0 rgba(0,0,0,.15),0 6px 14px rgba(0,0,0,.35);border:1px solid #d8cdb5;direction:ltr;flex:none;user-select:none}
.card.red{color:var(--suit-red)}
.card .ix{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.95;font-family:var(--f-card);font-weight:700;font-size:calc(var(--cw)*0.26)}
.card .ix i{font-style:normal;font-size:calc(var(--cw)*0.22)}
.card .tl{top:5%;left:7%} .card .br{bottom:5%;right:7%;transform:rotate(180deg)}
.card .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*0.55)}
.card.face .pip{font-family:var(--f-card);font-weight:700;font-size:calc(var(--cw)*0.42)}
.card.face .pip span{display:grid;place-items:center;width:58%;height:52%;border:1.5px solid currentColor;border-radius:6px}
.card.trump{box-shadow:0 0 0 2px var(--brass),0 6px 14px rgba(0,0,0,.35)}

.hand{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;z-index:4;padding-inline:6px}
.hand .card{margin-inline-start:calc(var(--cw)*-0.30);transition:transform .15s, filter .15s;padding:0}
.hand .card:first-child{margin-inline-start:0}
.hand.active .card.ok{transform:translateY(-12px)}
.hand.active .card.ok:hover{transform:translateY(-22px)}
.hand.active .card.no{filter:brightness(.55) saturate(.6);cursor:not-allowed}
.hand .card.hint{box-shadow:0 0 0 3px #7ee0ff,0 0 24px rgba(126,224,255,.8)}

#trick{position:absolute;left:50%;top:44%;width:0;height:0;z-index:5}
#trick .card{position:absolute;left:0;top:0}
#flip{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px}
#flip .lbl{font-size:12px;color:var(--muted)}

/* Action panel */
.panel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--ch) + 26px);z-index:8;background:var(--panel);border:1px solid var(--brass-deep);
  border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:calc(100% - 16px)}
.panel h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:15px;color:var(--brass)}
.panel .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bbtn{font-family:var(--f-display);font-size:17px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);min-width:64px}
.bbtn:hover{border-color:var(--brass)}
.bbtn.main{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.bbtn .s{font-size:19px}
.bbtn.red .s{color:#ff8a7e}
.panel .tip{font-size:12px;color:var(--muted)}

#toast{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:20;background:var(--ivory);color:var(--ink);font-family:var(--f-display);
  font-size:18px;padding:8px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* counter */
#counter{position:absolute;top:10px;left:10px;z-index:7;background:rgba(8,34,25,.92);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:12px}
#counter .r{display:flex;gap:3px;align-items:center;margin-top:3px;direction:ltr}
#counter .r .s{width:16px;text-align:center;font-size:14px}
#counter .r .s.red{color:#ff8a7e}
#counter .c{width:20px;text-align:center;border-radius:4px;background:var(--ivory);color:var(--ink);font-family:var(--f-card);font-weight:700;font-size:11px;padding:1px 0}
#counter .c.gone{opacity:.18}
#counter .c.mine{background:#bfe9cf}
#counter .h{font-family:var(--f-display);color:var(--brass)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(3,14,10,.72);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--brass-deep);border-radius:20px;padding:18px;width:min(520px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{font-family:var(--f-display);font-weight:700;color:var(--brass);margin:0 0 10px;font-size:22px;text-wrap:balance}
.modal p{line-height:1.7;margin:6px 0;color:var(--text)}
.modal .muted{color:var(--muted);font-size:13px}
.modal table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.modal th,.modal td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.modal th{color:var(--muted);font-weight:500}
.modal .actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.modal .big{display:flex;justify-content:center;gap:28px;margin:10px 0}
.modal .big div{text-align:center} .modal .big b{display:block;font-family:var(--f-display);font-size:34px}
.modal .big .us b{color:var(--us)} .modal .big .them b{color:var(--them)}
.verdict{text-align:center;font-family:var(--f-display);font-size:20px;margin:4px 0 8px}
.verdict.win{color:var(--us)} .verdict.lose{color:var(--them)}
.field{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px}
.seg button.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.rules h4{font-family:var(--f-display);color:var(--brass);margin:12px 0 4px;font-weight:500}
.rules ul{margin:0;padding-inline-start:18px;line-height:1.8}
.ltrick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.ltrick figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.ltrick figure.w .card{box-shadow:0 0 0 3px var(--brass)}

/* start screen */
.start{text-align:center}
.start .logo{font-family:var(--f-display);font-size:46px;color:var(--brass);line-height:1.1;margin:4px 0}
.start .sub{color:var(--muted);margin-bottom:12px}
.start .fan{display:flex;justify-content:center;margin:8px 0 16px;height:calc(var(--ch)*0.9)}
.start .fan .card{--cw:58px;--ch:82px;margin-inline-start:-22px}
.start .fan .card:first-child{margin-inline-start:0}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;text-align:start;font-size:13px;margin:10px 0;color:var(--muted)}
.feat span::before{content:"◆ ";color:var(--brass)}
.stats{font-size:12.5px;color:var(--muted)}

@media (max-width:560px){
  .score .team b{font-size:19px}
  .avatar{width:38px;height:38px;font-size:16px}
  .seat[data-p="0"]{display:none}
  .tbtn{padding:5px 8px;font-size:12px}
  .feat{grid-template-columns:1fr}
  #counter{top:auto;bottom:calc(var(--ch) + 22px);left:8px;padding:6px;font-size:11px}
  #counter .c{width:15px;font-size:10px}
  #counter .r{gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app" dir="rtl" lang="ar">
  <header class="hud">
    <div class="score" aria-label="النتيجة">
      <div class="team us"><small>لنا</small><b id="sUs">0</b><div class="bar"><i id="bUs" style="width:0"></i></div></div>
      <div class="sep"></div>
      <div class="team them"><small>لهم</small><b id="sThem">0</b><div class="bar"><i id="bThem" style="width:0"></i></div></div>
    </div>
    <div id="contract" class="chip">بانتظار التوزيع</div>
    <div id="abnat" class="abnat"></div>
    <div class="tools">
      <button class="tbtn" id="tHint" title="اقتراح أفضل حركة">تلميح</button>
      <button class="tbtn" id="tLast" title="آخر أكلة">آخر أكلة</button>
      <button class="tbtn" id="tCounter" title="عداد الورق">العداد</button>
      <button class="tbtn" id="tLog" title="سجل الصكة">السجل</button>
      <button class="tbtn" id="tRules">القوانين</button>
      <button class="tbtn" id="tSet">الإعدادات</button>
    </div>
  </header>
  <main class="table" id="table">
    <div class="seat foe" data-p="1"><div class="bubble"></div><div class="avatar">س</div><div class="pname"></div><div class="tags"></div><div class="backs"></div></div>
    <div class="seat ally" data-p="2"><div class="bubble"></div><div class="avatar">ف</div><div class="pname"></div><div class="tags"></div><div class="backs"></div></div>
    <div class="seat foe" data-p="3"><div class="bubble"></div><div class="avatar">م</div><div class="pname"></div><div class="tags"></div><div class="backs"></div></div>
    <div class="seat ally" data-p="0"><div class="bubble"></div><div class="avatar">أ</div><div class="pname"></div><div class="tags"></div></div>
    <div id="flip"></div>
    <div id="trick"></div>
    <div id="panel" class="panel" hidden></div>
    <div id="counter" hidden></div>
    <div id="hand" class="hand"></div>
    <div id="toast"></div>
  </main>
  <div id="overlay" class="overlay" hidden><div class="modal" id="modal"></div></div>
</div>

<script>
(()=>{
'use strict';
/* ========= constants ========= */
const SUITS=['S','H','C','D'];
const SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
const SNAME={S:'شريا',H:'هاص',D:'ديمن',C:'سبيت'};
const RED=s=>s==='H'||s==='D';
const RANKS=['7','8','9','10','J','Q','K','A'];           // natural sequence order (projects)
const ORD_N=['7','8','9','J','Q','K','10','A'];           // strength in Sun / non-trump
const ORD_T=['7','8','Q','K','10','A','9','J'];           // strength of trump
const PTS_N={A:11,'10':10,K:4,Q:3,J:2,'9':0,'8':0,'7':0};
const PTS_T={J:20,'9':14,A:11,'10':10,K:4,Q:3,'8':0,'7':0};
const RNAME={'7':'سبعة','8':'ثمانية','9':'تسعة','10':'عشرة',J:'ولد',Q:'بنت',K:'شايب',A:'إكة'};
const NAMES=['أنت','أبو سعد','فهد','مشعل'];
const PROJ_NAME={sira:'سرا','50':'خمسين','100':'مية','400':'أربعمية'};
const PROJ_RANK={sira:1,'50':2,'100':3,'400':4};
const PROJ_PTS={sun:{sira:4,'50':10,'100':20,'400':40},hokm:{sira:2,'50':5,'100':10,'400':10}};
const SPEED={slow:1.6,normal:1,fast:.45};
const team=p=>p%2, partner=p=>(p+2)%4;
const cid=c=>c.r+c.s;
const FULL=[];for(const s of SUITS)for(const r of RANKS)FULL.push({r,s});

/* ========= storage ========= */
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v?{...d,...v}:{...d}}catch(e){return {...d}}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const settings=load('baloot.settings',{level:'mid',speed:'normal',sound:true,target:152,counter:false});
const stats=load('baloot.stats',{played:0,won:0,kaboot:0,rounds:0,best:0});

/* ========= async control ========= */
let GEN=0;const ABORT={abort:true};
const wait=ms=>{const g=GEN;return new Promise((res,rej)=>setTimeout(()=>g===GEN?res():rej(ABORT),ms*SPEED[settings.speed]))};
let pending=null;
function ask(kind,data){return new Promise((res,rej)=>{pending={kind,res,rej,data};render();if(window.__auto)setTimeout(autoAnswer,30)})}
function answer(v){if(!pending)return;const p=pending;pending=null;clearHint();p.res(v);render()}
function autoAnswer(){if(!pending)return;const k=pending.kind;
  if(k==='card')answer(botCard(0,'hard'));
  else if(k==='bid')answer(botBid(0,pending.data.round,pending.data.opts));
  else if(k==='double')answer(botDouble(0));
  else if(k==='next')answer(true);}

/* ========= state ========= */
let S=null;
function newMatch(){return{scores:[0,0],dealer:Math.floor(Math.random()*4),round:0,log:[],hands:[[],[],[],[]],deck:[],flip:null,contract:null,
  trick:[],leader:0,turn:-1,raw:[0,0],tricks:[0,0],played:[],voids:[{},{},{},{}],lastTrick:null,projects:null,baloot:null,phase:'idle',over:false}}

/* ========= card logic ========= */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const isTrump=c=>!!(S.contract&&S.contract.type==='hokm'&&c.s===S.contract.trump);
const pts=c=>isTrump(c)?PTS_T[c.r]:PTS_N[c.r];
const rankPow=c=>isTrump(c)?ORD_T.indexOf(c.r):ORD_N.indexOf(c.r);
function power(c,led){if(isTrump(c))return 100+ORD_T.indexOf(c.r);if(c.s===led)return ORD_N.indexOf(c.r);return -1}
function winnerOf(trick){const led=trick[0].c.s;let b=trick[0];for(const t of trick)if(power(t.c,led)>power(b.c,led))b=t;return b}

function legal(p){
  const hand=S.hands[p],tr=S.trick;
  if(!tr.length)return hand.slice();
  const led=tr[0].c.s,follow=hand.filter(c=>c.s===led);
  const hokm=S.contract.type==='hokm',T=S.contract.trump;
  if(!hokm)return follow.length?follow:hand.slice();
  const bestT=Math.max(-1,...tr.filter(t=>isTrump(t.c)).map(t=>power(t.c,led)));
  if(led===T){
    if(!follow.length)return hand.slice();
    const up=follow.filter(c=>power(c,led)>bestT);
    return up.length?up:follow;
  }
  if(follow.length)return follow;
  const trumps=hand.filter(isTrump);
  if(!trumps.length)return hand.slice();
  if(team(winnerOf(tr).p)===team(p))return hand.slice();   // partner holding the trick: free choice
  if(bestT>=0){const up=trumps.filter(c=>power(c,led)>bestT);return up.length?up:hand.slice()}
  return trumps;
}
function sortHand(h){
  const tr=S.contract&&S.contract.type==='hokm'?S.contract.trump:null;
  const present=SUITS.filter(s=>h.some(c=>c.s===s));
  // alternate colours where possible, trump first
  let order=[];const blacks=present.filter(s=>!RED(s)),reds=present.filter(RED);
  while(blacks.length||reds.length){if(blacks.length)order.push(blacks.shift());if(reds.length)order.push(reds.shift())}
  if(tr&&order.includes(tr)){order=order.filter(s=>s!==tr);order.unshift(tr)}
  return h.sort((a,b)=>order.indexOf(a.s)-order.indexOf(b.s)||rankPow(b)-rankPow(a));
}

/* ========= projects ========= */
function findProjects(hand){
  const res=[],used=new Set(),type=S.contract.type;
  for(const r of ['A','10','K','Q','J']){const cs=hand.filter(c=>c.r===r);if(cs.length===4){
    const t=r==='A'&&type==='sun'?'400':'100';res.push({t,top:RANKS.indexOf(r),cards:cs,four:true});cs.forEach(c=>used.add(cid(c)))}}
  for(const s of SUITS){
    const idx=hand.filter(c=>c.s===s&&!used.has(cid(c))).map(c=>RANKS.indexOf(c.r)).sort((a,b)=>b-a);
    let i=0;while(i<idx.length){let j=i;while(j+1<idx.length&&idx[j+1]===idx[j]-1)j++;
      let len=j-i+1,top=idx[i];
      while(len>=3){const take=len>=5?5:len;const t=take===5?'100':take===4?'50':'sira';
        const cards=[];for(let k=0;k<take;k++)cards.push({r:RANKS[top-k],s});
        res.push({t,top,s,cards});top-=take;len-=take}
      i=j+1}
  }
  return res;
}
function resolveProjects(){
  const all=[0,1,2,3].map(p=>findProjects(S.hands[p]));
  const best=[-1,-1];
  for(let p=0;p<4;p++){const oi=(p-S.dealer+3)%4;for(const pr of all[p]){const k=PROJ_RANK[pr.t]*1000+pr.top*10+(3-oi);if(k>best[team(p)])best[team(p)]=k}}
  let win=-1;if(best[0]>=0||best[1]>=0)win=best[0]>best[1]?0:1;
  const ptsT=[0,0];
  if(win>=0)for(let p=0;p<4;p++)if(team(p)===win)for(const pr of all[p])ptsT[win]+=PROJ_PTS[S.contract.type][pr.t];
  let baloot=null;
  if(S.contract.type==='hokm'){const T=S.contract.trump;for(let p=0;p<4;p++)if(S.hands[p].some(c=>c.s===T&&c.r==='K')&&S.hands[p].some(c=>c.s===T&&c.r==='Q'))baloot={p,shown:0}}
  S.projects={all,win,pts:ptsT};S.baloot=baloot;
}
const projLabel=list=>list.map(pr=>PROJ_NAME[pr.t]).join(' + ');

/* ========= AI ========= */
const HV={J:3.5,'9':3,A:2,'10':1.5,K:1,Q:1,'8':.7,'7':.7};
function hokmScore(cards,s){let sc=0,n=0;for(const c of cards){if(c.s===s){n++;sc+=HV[c.r]}else if(c.r==='A')sc+=1.4;else if(c.r==='10'&&cards.some(x=>x.s===c.s&&x.r==='A'))sc+=.6}
  if(n>=3)sc+=1;if(n>=4)sc+=1;if(n<=1)sc-=2;return sc}
function sunScore(cards){let sc=0;for(const c of cards){if(c.r==='A')sc+=2.6;else if(c.r==='10')sc+=cards.some(x=>x.s===c.s&&x.r==='A')?1.4:.4;else if(c.r==='K')sc+=.35}return sc}
function botBid(p,round,opts){
  const h=S.hands[p],f=S.flip,six=h.concat([f]);
  const lvl=p===0?'hard':settings.level;
  const noise=lvl==='easy'?(Math.random()*3-1.5):0;
  const sun=sunScore(six)+noise;
  const hokmBy=S.bidState&&S.bidState.hokm;
  if(opts.includes('sun')){
    const need=hokmBy!=null&&team(hokmBy)===team(p)?10.5:7.3;
    if(sun>=need)return{t:'sun'};
  }
  if(round===1&&opts.includes('hokm')){if(hokmScore(six,f.s)+noise>=7.2)return{t:'hokm'}}
  if(round===2&&opts.includes('hokm2')){
    let bs=null,bv=-9;for(const s of SUITS)if(s!==f.s){const v=hokmScore(six,s);if(v>bv){bv=v;bs=s}}
    if(bv+noise>=7)return{t:'hokm2',s:bs};
  }
  return{t:'pass'};
}
function botDouble(p){const T=S.contract.trump;return hokmScore(S.hands[p],T)>=6.5}

function unseenFor(p){const known=new Set(S.played.map(cid).concat(S.hands[p].map(cid)));return FULL.filter(c=>!known.has(cid(c)))}
function isMaster(c,p){const un=unseenFor(p);return !un.some(u=>u.s===c.s&&rankPow(u)>rankPow(c))}
const lowKey=c=>pts(c)*20+rankPow(c)+(isTrump(c)?60:0);
const lowest=a=>a.slice().sort((x,y)=>lowKey(x)-lowKey(y))[0];
const giveKey=c=>pts(c)-(isTrump(c)?40:0)-(c.r==='A'?3:0);
const giveMost=a=>a.slice().sort((x,y)=>giveKey(y)-giveKey(x)||rankPow(x)-rankPow(y))[0];

function botCard(p,level){
  level=level||settings.level;
  const L=legal(p);if(L.length===1)return L[0];
  if(level==='easy'&&Math.random()<.55)return L[Math.floor(Math.random()*L.length)];
  const hard=level==='hard';
  const hokm=S.contract.type==='hokm',T=S.contract.trump;
  const un=unseenFor(p);
  const trumpsOut=hokm&&un.some(c=>c.s===T);
  const opps=[(p+1)%4,(p+3)%4];
  const oppMayCut=s=>hard&&hokm&&trumpsOut&&opps.some(o=>S.voids[o][s]&&!S.voids[o][T]);

  if(!S.trick.length){
    const buyerTeam=team(p)===team(S.contract.buyer);
    if(hokm){
      const myT=L.filter(isTrump);
      if(buyerTeam&&myT.length&&trumpsOut){
        const m=myT.filter(c=>isMaster(c,p));
        if(m.length)return m.sort((a,b)=>rankPow(b)-rankPow(a))[0];
        if(p===S.contract.buyer&&myT.length>=4)return lowest(myT);
      }
    }
    const masters=L.filter(c=>!isTrump(c)&&isMaster(c,p)&&!oppMayCut(c.s));
    if(masters.length)return masters.sort((a,b)=>pts(b)-pts(a))[0];
    if(hard&&hokm){const pv=L.filter(c=>!isTrump(c)&&S.voids[partner(p)][c.s]&&!S.voids[partner(p)][T]&&pts(c)===0);if(pv.length)return pv[0]}
    // avoid leading a bare ten
    const side=L.filter(c=>!isTrump(c));
    const pool=(side.length?side:L).filter(c=>!(c.r==='10'&&!S.hands[p].some(x=>x.s===c.s&&x.r==='A')&&un.some(u=>u.s===c.s&&u.r==='A')));
    return lowest(pool.length?pool:(side.length?side:L));
  }
  const led=S.trick[0].c.s,win=winnerOf(S.trick),partnerWin=team(win.p)===team(p);
  const last=S.trick.length===3;
  const winners=L.filter(c=>power(c,led)>power(win.c,led));
  const trickPts=S.trick.reduce((a,t)=>a+pts(t.c),0);
  const after=[];for(let i=S.trick.length+1;i<4;i++)after.push((S.leader+i)%4);
  const oppAfter=after.filter(x=>team(x)!==team(p));
  const safeCard=(c)=>{ // would c (or partner's card) hold against the players still to act?
    if(isTrump(c)){return !un.some(u=>u.s===T&&rankPow(u)>rankPow(c))||!oppAfter.length}
    const higher=un.some(u=>u.s===c.s&&rankPow(u)>rankPow(c));
    const cut=hokm&&trumpsOut&&oppAfter.some(o=>hard?S.voids[o][led]&&!S.voids[o][T]:false);
    return !oppAfter.length||(!higher&&!cut);
  };
  if(last){
    if(partnerWin)return giveMost(L);
    if(winners.length){
      const plain=winners.filter(c=>!isTrump(c));
      if(plain.length)return plain.sort((a,b)=>pts(b)-pts(a)||rankPow(a)-rankPow(b))[0];
      if(trickPts>=4||Math.random()<.6||!hokm)return winners.sort((a,b)=>rankPow(a)-rankPow(b))[0];
    }
    return lowest(L);
  }
  if(partnerWin&&safeCard(win.c))return giveMost(L);
  if(partnerWin)return lowest(L);
  if(winners.length){
    const sure=winners.filter(safeCard);
    if(sure.length){
      const plain=sure.filter(c=>!isTrump(c));
      if(plain.length)return plain.sort((a,b)=>rankPow(a)-rankPow(b))[0];
      return sure.sort((a,b)=>rankPow(a)-rankPow(b))[0];
    }
    const tw=winners.filter(isTrump);
    if(tw.length&&!winners.some(c=>!isTrump(c)))return tw.sort((a,b)=>rankPow(a)-rankPow(b))[0];
    if(trickPts>=10)return winners.sort((a,b)=>rankPow(b)-rankPow(a))[0];
  }
  return lowest(L);
}

/* ========= sound ========= */
let actx=null;
function snd(kind){
  if(!settings.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;
    if(kind==='card'){
      const len=.07,buf=actx.createBuffer(1,actx.sampleRate*len,actx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
      const src=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
      f.type='bandpass';f.frequency.value=1800;g.gain.value=.5;src.buffer=buf;src.connect(f).connect(g).connect(actx.destination);src.start(t);
      return;
    }
    const notes={win:[523,784],bid:[440],good:[523,659,784,1047],bad:[392,330,262],proj:[659,880]}[kind]||[440];
    notes.forEach((fq,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=fq;
      g.gain.setValueAtTime(0,t+i*.09);g.gain.linearRampToValueAtTime(.13,t+i*.09+.01);g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.28);
      o.connect(g).connect(actx.destination);o.start(t+i*.09);o.stop(t+i*.09+.3)});
  }catch(e){}
}

  renderHand();renderPanel();renderCounter();

  $('#tCounter').classList.toggle('on',settings.counter);
}
function renderHand(){
  const h=$('#hand');h.innerHTML='';
  const my=sortHand(S.hands[0].slice());
  const active=pending&&pending.kind==='card';
  const L=active?legal(0).map(cid):[];
  h.classList.toggle('active',!!active);
  for(const c of my){
    const ok=L.includes(cid(c));
    const el=cardBtn(c,(active?(ok?'ok':'no'):'')+(S.contract&&isTrump(c)?' trump':''));
    el.setAttribute('role','button');el.tabIndex=active&&ok?0:-1;
    el.setAttribute('aria-label',cardName(c));
    const act=()=>{if(pending&&pending.kind==='card'&&legal(0).some(x=>cid(x)===cid(c)))answer(S.hands[0].find(x=>cid(x)===cid(c)));else if(active)toast('هذي الورقة ما تنلعب الحين',1200)};
    el.addEventListener('click',act);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}});
    h.appendChild(el);
  }
}
function renderPanel(){
  const pn=$('#panel');
  if(!pending||(pending.kind!=='bid'&&pending.kind!=='double')){pn.hidden=true;pn.innerHTML='';return}
  pn.hidden=false;
  if(pending.kind==='double'){
    const T=S.contract.trump;
    pn.innerHTML=`<h3>${NAMES[S.contract.buyer]} اشترى حكم ${SYM[T]} — تدبّل؟</h3><div class="row">
      <button class="bbtn main" data-v="1">دبل ×2</button><button class="bbtn" data-v="0">لا، كمّل</button></div>`;
    pn.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b.dataset.v==='1'));
    return;
  }
  const {round,opts}=pending.data,f=S.flip;let html=`<h3>${round===1?'الدور الأول':'الدور الثاني'} — وش تبي؟</h3><div class="row">`;
  if(opts.includes('hokm'))html+=`<button class="bbtn main ${RED(f.s)?'red':''}" data-t="hokm">حكم <span class="s">${SYM[f.s]}</span></button>`;
  if(opts.includes('hokm2'))for(const s of SUITS)if(s!==f.s)html+=`<button class="bbtn ${RED(s)?'red':''}" data-t="hokm2" data-s="${s}">حكم <span class="s">${SYM[s]}</span></button>`;
  if(opts.includes('sun'))html+=`<button class="bbtn main" data-t="sun">صن ☀</button>`;
  if(opts.includes('ashkal'))html+=`<button class="bbtn" data-t="ashkal">أشكل</button>`;
  html+=`<button class="bbtn" data-t="pass">بس</button></div>`;
  if(pending.data.hint)html+=`<div class="tip">${pending.data.hint}</div>`;
  pn.innerHTML=html;
  pn.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b.dataset.s?{t:b.dataset.t,s:b.dataset.s}:{t:b.dataset.t}));
}
function renderCounter(){
  const el=$('#counter');
  if(!settings.counter||!S||!S.contract||S.phase==='idle'){el.hidden=true;return}
  el.hidden=false;
  const played=new Set(S.played.map(cid)),mine=new Set(S.hands[0].map(cid));
  let html=`<div class="h">عداد الورق</div>`;
  for(const s of SUITS){
    const rs=(S.contract.type==='hokm'&&s===S.contract.trump?ORD_T:ORD_N).slice().reverse();
    const left=rs.filter(r=>!played.has(r+s)&&!mine.has(r+s)).length;
    html+=`<div class="r"><span class="s ${RED(s)?'red':''}">${SYM[s]}</span>`+rs.map(r=>`<span class="c ${played.has(r+s)?'gone':''} ${mine.has(r+s)?'mine':''}">${r==='10'?'10':r}</span>`).join('')+`<span style="margin-inline-start:4px;color:var(--muted)">${left}</span></div>`;
  }
  el.innerHTML=html;
}

/* trick animation */
function seatVec(p){const tb=$('#table').getBoundingClientRect();const v=[[0,tb.height*.5],[tb.width*.5,0],[0,-tb.height*.5],[-tb.width*.5,0]];return v[p]}
function slotVec(p,cw,ch){return[[0,ch*.36],[cw*.72,-ch*.04],[0,-ch*.44],[-cw*.72,-ch*.04]][p]}
const ROT=[ -3, 6, 2, -6 ];
function addTrickCard(p,c){
  const el=cardBtn(c,isTrump(c)?'trump':'');
  $('#trick').appendChild(el);
  const cw=el.offsetWidth,ch=el.offsetHeight;
  const [x,y]=slotVec(p,cw,ch),[fx,fy]=seatVec(p);
  const to=`translate(-50%,-50%) translate(${x}px,${y}px) rotate(${ROT[p]}deg)`;
  el.style.transform=to;
  el.animate([{transform:`translate(-50%,-50%) translate(${fx}px,${fy}px) scale(.7)`,opacity:.2},{transform:to,opacity:1}],{duration:280*SPEED[settings.speed],easing:'cubic-bezier(.2,.8,.3,1)'});
  snd('card');
}
function collectTrick(w){
  const [wx,wy]=seatVec(w);
  const els=[...document.querySelectorAll('#trick .card')];
  return Promise.all(els.map(el=>el.animate([{transform:el.style.transform,opacity:1},{transform:`translate(-50%,-50%) translate(${wx*.9}px,${wy*.9}px) scale(.45)`,opacity:0}],
    {duration:420*SPEED[settings.speed],easing:'ease-in',fill:'forwards'}).finished.catch(()=>{}))).then(()=>{$('#trick').innerHTML=''});
}

/* ========= game flow ========= */
async function startMatch(){
  GEN++;if(pending){const p=pending;pending=null;p.rej(ABORT)}
  closeModal();S=newMatch();$('#trick').innerHTML='';clearBubbles();render();
  try{
    while(!S.over){await playRound()}
  }catch(e){if(e!==ABORT)console.error(e)}
}
function deal(n){for(let i=1;i<=4;i++){const p=(S.dealer+i)%4;for(let k=0;k<n;k++)S.hands[p].push(S.deck.pop())}}

async function playRound(){
  Object.assign(S,{hands:[[],[],[],[]],deck:shuffle(FULL.map(c=>({...c}))),flip:null,contract:null,trick:[],turn:-1,raw:[0,0],tricks:[0,0],
    played:[],voids:[{},{},{},{}],lastTrick:null,projects:null,baloot:null,phase:'deal',bidState:{hokm:null}});
  $('#trick').innerHTML='';clearBubbles();render();
  await wait(350);
  deal(3);render();snd('card');await wait(250);deal(2);S.flip=S.deck.pop();S.phase='bid';render();snd('card');
  toast(`التوزيع على ${NAMES[S.dealer]==='أنت'?'يدك':NAMES[S.dealer]}`,1100);
  await wait(900);
  const ct=await bidding();
  clearBubbles();S.turn=-1;
  if(!ct){toast('الكل قال بس — نعيد التوزيع');await wait(1500);S.dealer=(S.dealer+1)%4;return}
  S.contract=ct;S.phase='contract';render();snd('bid');
  toast(ct.type==='sun'?`${ct.ashkal!=null?NAMES[ct.ashkal]+' أشكل · ':''}صن ل${ct.buyer===0?'ك':NAMES[ct.buyer]}`:`حكم ${SYM[ct.trump]} ${SNAME[ct.trump]} ل${ct.buyer===0?'ك':NAMES[ct.buyer]}`,1500);
  await wait(1200);
  // double (hokm only)
  if(ct.type==='hokm'){
    for(const o of [(ct.buyer+1)%4,(ct.buyer+3)%4]){
      let d;
      if(o===0){d=await ask('double')}else{await wait(400);d=botDouble(o)}
      if(d){ct.doubled=true;bubble(o,'دبل!',1600);snd('proj');toast(`${NAMES[o]} دبّل — النقاط ×2`,1500);render();await wait(1100);break}
    }
  }
  // complete the deal
  for(let i=1;i<=4;i++){const p=(S.dealer+i)%4;if(p===ct.buyer){S.hands[p].push(S.flip);S.hands[p].push(S.deck.pop(),S.deck.pop())}else S.hands[p].push(S.deck.pop(),S.deck.pop(),S.deck.pop())}
  S.flip=null;S.phase='play';resolveProjects();render();
  await wait(500);
  // play 8 tricks
  S.leader=(S.dealer+1)%4;
  for(let t=0;t<8;t++){
    S.trick=[];
    for(let i=0;i<4;i++){
      const p=(S.leader+i)%4;S.turn=p;render();
      let c;
      if(p===0)c=await ask('card');
      else{await wait(520+Math.random()*260);c=botCard(p)}
      playCard(p,c);
      if(t===0&&S.projects.all[p].length){bubble(p,projLabel(S.projects.all[p]),1800,'proj');snd('proj')}
      render();
      await wait(170);
    }
    S.turn=-1;render();
    const w=winnerOf(S.trick).p;
    const gain=S.trick.reduce((a,x)=>a+pts(x.c),0)+(t===7?10:0);
    await wait(650);
    S.raw[team(w)]+=gain;S.tricks[team(w)]++;
    S.lastTrick={cards:S.trick.slice(),w,gain};
    snd(team(w)===0?'win':'card');
    await collectTrick(w);
    S.leader=w;S.trick=[];render();
    if(t===0)announceProjects();
  }
  await scoreRound();
}
function playCard(p,c){
  const h=S.hands[p];const i=h.findIndex(x=>cid(x)===cid(c));h.splice(i,1);
  if(S.trick.length){
    const led=S.trick[0].c.s;
    if(c.s!==led){S.voids[p][led]=true;
      if(S.contract.type==='hokm'&&led!==S.contract.trump&&!isTrump(c)&&team(winnerOf(S.trick).p)!==team(p))S.voids[p][S.contract.trump]=true}
  }
  S.trick.push({p,c});S.played.push(c);
  addTrickCard(p,c);
  if(S.baloot&&S.baloot.p===p&&isTrump(c)&&(c.r==='K'||c.r==='Q')){S.baloot.shown++;if(S.baloot.shown===2){bubble(p,'بلوت',1600,'proj');snd('proj')}}
}
function announceProjects(){
  const pr=S.projects;if(pr.win<0)return;
  const list=[0,1,2,3].filter(p=>team(p)===pr.win).flatMap(p=>pr.all[p]);
  const loseTeam=1-pr.win,lost=[0,1,2,3].filter(p=>team(p)===loseTeam).flatMap(p=>pr.all[p]);
  toast(`مشروع ${pr.win===0?'لنا':'لهم'}: ${projLabel(list)} (+${pr.pts[pr.win]})${lost.length?`<br><small>انلغى مشروع ${loseTeam===0?'لنا':'لهم'}</small>`:''}`,2200);
}
async function getBid(p,round,opts){
  S.turn=p;render();
  let b;
  if(p===0){
    const sug=botBid(0,round,opts);
    b=await ask('bid',{round,opts,sugg:sug});
  }else{await wait(650+Math.random()*300);b=botBid(p,round,opts)}
  const txt={hokm:`حكم ${SYM[S.flip.s]}`,sun:'صن',pass:'بس',ashkal:'أشكل'}[b.t]||`حكم ${SYM[b.s]}`;
  bubble(p,txt,round===2&&b.t==='pass'?2200:0);snd(b.t==='pass'?'card':'bid');
  await wait(250);
  return b;
}
async function bidding(){
  const order=[1,2,3,4].map(i=>(S.dealer+i)%4);
  S.bidState={hokm:null};
  for(let i=0;i<4;i++){
    const p=order[i];
    const opts=S.bidState.hokm===null?['hokm','sun','pass']:['sun','pass'];
    if(S.bidState.hokm===null&&i>=2&&S.flip.r!=='A')opts.push('ashkal');
    const b=await getBid(p,1,opts);
    if(b.t==='sun')return{type:'sun',buyer:p};
    if(b.t==='ashkal')return{type:'sun',buyer:partner(p),ashkal:p};
    if(b.t==='hokm')S.bidState.hokm=p;
  }
  if(S.bidState.hokm!==null)return{type:'hokm',trump:S.flip.s,buyer:S.bidState.hokm};
  clearBubbles();toast('الدور الثاني',900);await wait(800);
  let h2=null;
  for(const p of order){
    const opts=h2===null?['hokm2','sun','pass']:['sun','pass'];
    const b=await getBid(p,2,opts);
    if(b.t==='sun')return{type:'sun',buyer:p};
    if(b.t==='hokm2'){h2={p,s:b.s};S.bidState.hokm=p}
  }
  if(h2)return{type:'hokm',trump:h2.s,buyer:h2.p};
  return null;
}

async function scoreRound(){
  S.phase='end';
  const ct=S.contract,b=team(ct.buyer),o=1-b,sun=ct.type==='sun',total=sun?26:16;
  const pp=S.projects.pts.slice();
  let kaboot=-1;if(S.tricks[0]===8)kaboot=0;else if(S.tricks[1]===8)kaboot=1;
  const tp=[0,0];
  if(kaboot>=0)tp[kaboot]=sun?44:25;
  else{const bp=sun?Math.round(S.raw[b]/5):Math.floor((S.raw[b]+4)/10);tp[b]=bp;tp[o]=total-bp}
  let fin=[0,0],fail=false,note='';
  if(kaboot>=0){
    fin[kaboot]=tp[kaboot]+pp[kaboot]+(kaboot===o?pp[b]:0);
    fail=kaboot===o;note=`كبوت ${kaboot===0?'لنا':'لهم'}!`;
  }else if(tp[b]+pp[b]<=tp[o]+pp[o]){
    fail=true;fin[o]=total+pp[0]+pp[1];note='المشتري خسر — الأرض كلها للخصم';
  }else{fin=[tp[0]+pp[0],tp[1]+pp[1]];note='المشتري كسب'}
  const mult=ct.doubled?2:1;fin=fin.map(x=>x*mult);
  let bal=0;if(S.baloot){fin[team(S.baloot.p)]+=2;bal=2}
  S.scores[0]+=fin[0];S.scores[1]+=fin[1];
  S.round++;stats.rounds++;if(kaboot===0)stats.kaboot++;save('baloot.stats',stats);
  S.log.push({n:S.round,type:sun?'صن':`حكم ${SYM[ct.trump]}`,buyer:NAMES[ct.buyer],us:fin[0],them:fin[1],note:(ct.doubled?'دبل · ':'')+note});
  render();
  snd(fin[0]>=fin[1]?'good':'bad');
  const tgt=settings.target;
  const done=(S.scores[0]>=tgt||S.scores[1]>=tgt)&&S.scores[0]!==S.scores[1];
  const projRows=[0,1].map(tm=>{const l=[0,1,2,3].filter(p=>team(p)===tm).flatMap(p=>S.projects.all[p]);return l.length?projLabel(l)+(S.projects.win===tm?'':' (ملغي)'):'—'});
  const html=`<h2>نهاية التوزيعة ${S.round}</h2>
    <div class="verdict ${fin[0]>=fin[1]?'win':'lose'}">${note}</div>
    <p class="muted" style="text-align:center">${sun?'صن':`حكم ${SYM[ct.trump]} ${SNAME[ct.trump]}`} · المشتري ${NAMES[ct.buyer]}${ct.doubled?' · مدبّل ×2':''}</p>
    <table><tr><th></th><th>لنا</th><th>لهم</th></tr>
      <tr><td>الأكلات</td><td>${S.tricks[0]}</td><td>${S.tricks[1]}</td></tr>
      <tr><td>الأبناط</td><td>${S.raw[0]}</td><td>${S.raw[1]}</td></tr>
      <tr><td>نقاط الأكل</td><td>${tp[0]}</td><td>${tp[1]}</td></tr>
      <tr><td>المشاريع</td><td>${projRows[0]}</td><td>${projRows[1]}</td></tr>
      ${bal?`<tr><td>بلوت</td><td>${team(S.baloot.p)===0?'+2':'—'}</td><td>${team(S.baloot.p)===1?'+2':'—'}</td></tr>`:''}
      <tr><td><b>حصيلة التوزيعة</b></td><td><b style="color:var(--us)">+${fin[0]}</b></td><td><b style="color:var(--them)">+${fin[1]}</b></td></tr>
    </table>
    <div class="big"><div class="us"><small>لنا</small><b>${S.scores[0]}</b></div><div class="them"><small>لهم</small><b>${S.scores[1]}</b></div></div>
    <div class="actions"><button class="bbtn main" id="mNext">${done?'النتيجة النهائية':'التوزيعة الجاية'}</button></div>`;
  openModal(html,false);
  $('#mNext').onclick=()=>answer(true);$('#mNext').focus();
  await ask('next');
  closeModal();
  if(done){
    S.over=true;const won=S.scores[0]>S.scores[1];
    stats.played++;if(won)stats.won++;stats.best=Math.max(stats.best,won?S.scores[0]-S.scores[1]:0);save('baloot.stats',stats);
    snd(won?'good':'bad');
    openModal(`<h2>${won?'مبروك! كسبتوا الصكة':'خسرتوا الصكة'}</h2>
      <div class="big"><div class="us"><small>لنا</small><b>${S.scores[0]}</b></div><div class="them"><small>لهم</small><b>${S.scores[1]}</b></div></div>
      <p class="muted" style="text-align:center">لعبتوا ${S.round} توزيعة · رصيدك: ${stats.won} فوز من ${stats.played} صكة</p>
      <div class="actions"><button class="bbtn main" id="mAgain">صكة جديدة</button><button class="bbtn" id="mLog2">السجل</button></div>`,true);
    $('#mAgain').onclick=()=>startMatch();$('#mLog2').onclick=showLog;
    return;
  }
  S.dealer=(S.dealer+1)%4;
}

/* ========= modals ========= */
function openModal(html,dismiss=true){$('#modal').innerHTML=html;$('#overlay').hidden=false;$('#overlay').dataset.dismiss=dismiss?'1':''}
function closeModal(){$('#overlay').hidden=true;$('#modal').innerHTML=''}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay'&&$('#overlay').dataset.dismiss)closeModal()});
function closeBtn(){return `<div class="actions"><button class="bbtn" onclick="document.getElementById('overlay').hidden=true">إغلاق</button></div>`}
function showLog(){
  if(!S)return;
  const rows=S.log.map(l=>`<tr><td>${l.n}</td><td>${l.type}</td><td>${l.buyer}</td><td style="color:var(--us)">${l.us}</td><td style="color:var(--them)">${l.them}</td><td style="font-size:12px">${l.note}</td></tr>`).join('');
  openModal(`<h2>سجل الصكة</h2><div style="overflow-x:auto"><table><tr><th>#</th><th>النوع</th><th>المشتري</th><th>لنا</th><th>لهم</th><th>ملاحظة</th></tr>${rows||'<tr><td colspan="6" class="muted">ما فيه توزيعات مكتملة للحين</td></tr>'}
    <tr><td colspan="3"><b>المجموع</b></td><td><b>${S.scores[0]}</b></td><td><b>${S.scores[1]}</b></td><td></td></tr></table></div>
    <p class="muted">الإحصائيات: ${stats.won} فوز من ${stats.played} صكة · ${stats.kaboot} كبوت لك · ${stats.rounds} توزيعة</p>${closeBtn()}`);
}
function showLast(){
  if(!S||!S.lastTrick)return;
  const lt=S.lastTrick;
  openModal(`<h2>آخر أكلة</h2><div class="ltrick">${lt.cards.map(t=>`<figure class="${t.p===lt.w?'w':''}">${cardHTML(t.c)}<figcaption>${NAMES[t.p]}</figcaption></figure>`).join('')}</div>
    <p style="text-align:center">أكلها <b>${NAMES[lt.w]}</b> · ${lt.gain} بنط</p>${closeBtn()}`);
}
function showRules(back){
  openModal(`<div class="rules"><h2>قوانين البلوت</h2>
  <p class="muted">٣٢ ورقة، أربع لاعبين، كل اثنين متقابلين فريق. اللعب عكس عقارب الساعة والصكة توصل ${settings.target}.</p>
  <h4>الشراء</h4><ul><li><b>صن ☀</b>: بدون حكم، النقاط مضاعفة (٢٦ في التوزيعة).</li><li><b>حكم</b>: نوع الورقة المكشوفة يصير الحكم في الدور الأول، وفي الدور الثاني تختار أي نوع ثاني (١٦ في التوزيعة).</li>
  <li><b>أشكل</b>: للاعب الثالث والرابع في الدور الأول — صن لخويك وهو ياخذ الورقة المكشوفة.</li><li><b>الصن يغلب الحكم</b>: لو أحد قال حكم، اللي بعده يقدر يقول صن.</li>
  <li><b>دبل</b>: الخصم يقدر يدبّل الحكم وتصير النقاط ×٢.</li></ul>
  <h4>ترتيب الورق</h4><ul><li>صن وغير الحكم: A ، 10 ، K ، Q ، J ، 9 ، 8 ، 7</li><li>الحكم: J ، 9 ، A ، 10 ، K ، Q ، 8 ، 7</li></ul>
  <h4>الأبناط</h4><ul><li>A=11 ، 10=10 ، K=4 ، Q=3 ، J=2</li><li>في الحكم: الولد=20 ، التسعة=14</li><li>الأرض (آخر أكلة)=10</li></ul>
  <h4>اللعب</h4><ul><li>لازم تنزل من نفس النوع إذا عندك.</li><li>في الحكم إذا ما عندك من النوع وعندك حكم لازم تدق، إلا إذا خويك ماسك الأكلة.</li><li>إذا نزل حكم لازم تكبّر عليه إذا تقدر.</li></ul>
  <h4>المشاريع</h4><ul><li>سرا (٣ ورا بعض): صن ٤ / حكم ٢</li><li>خمسين (٤ ورا بعض): صن ١٠ / حكم ٥</li><li>مية (٥ ورا بعض أو أربع K/Q/J/10): صن ٢٠ / حكم ١٠</li><li>أربعمية (أربع إكك في الصن): ٤٠</li><li>بلوت (الشايب والبنت من الحكم): ٢ ولا ينلغى</li><li>يحسب مشروع الفريق الأعلى فقط.</li></ul>
  <h4>الحساب</h4><ul><li>المشتري لازم يجيب أكثر من خصمه، وإلا الأرض كلها والمشاريع تروح للخصم.</li><li>كبوت (كل الأكلات): صن ٤٤ / حكم ٢٥.</li></ul></div>${typeof back==='function'?'<div class="actions"><button class="bbtn main" id="mBack">رجوع</button></div>':closeBtn()}`,typeof back!=='function');
  if(typeof back==='function')$('#mBack').onclick=back;
}
function showSettings(){
  const seg=(key,opts)=>`<div class="seg" data-k="${key}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(settings[key])===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
  openModal(`<h2>الإعدادات</h2>
    <div class="field"><span>مستوى البوتات</span>${seg('level',[['easy','سهل'],['mid','متوسط'],['hard','محترف']])}</div>
    <div class="field"><span>سرعة اللعب</span>${seg('speed',[['slow','هادي'],['normal','عادي'],['fast','سريع']])}</div>
    <div class="field"><span>الأصوات</span>${seg('sound',[[true,'تشغيل'],[false,'إيقاف']])}</div>
    <div class="field"><span>نهاية الصكة</span>${seg('target',[[101,'101'],[152,'152'],[202,'202']])}</div>
    <p class="muted">تغيير نهاية الصكة يطبّق على الصكة الحالية.</p>
    <div class="actions"><button class="bbtn" id="mNew">صكة جديدة</button><button class="bbtn main" onclick="document.getElementById('overlay').hidden=true">تم</button></div>`);
  document.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=g.dataset.k;let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;else if(k==='target')v=+v;
    settings[k]=v;save('baloot.settings',settings);g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render()}));
  $('#mNew').onclick=()=>startMatch();
}
function clearHint(){document.querySelectorAll('.hand .hint').forEach(e=>e.classList.remove('hint'))}
function hint(){
  if(!pending)return;
  if(pending.kind==='card'){const c=botCard(0,'hard');clearHint();const el=document.querySelector(`.hand .card[data-id="${cid(c)}"]`);if(el)el.classList.add('hint');toast(`اقتراح: ${cardName(c)}`,1300)}
  else if(pending.kind==='bid'){const s=pending.data.sugg;const t={hokm:`حكم ${SYM[S.flip.s]}`,sun:'صن',pass:'بس',ashkal:'أشكل'}[s.t]||`حكم ${SYM[s.s]}`;pending.data.hint=`اقتراح المحترف: ${t}`;renderPanel()}
}
$('#tHint').onclick=hint;$('#tLast').onclick=showLast;$('#tLog').onclick=showLog;$('#tRules').onclick=showRules;$('#tSet').onclick=showSettings;
$('#tCounter').onclick=()=>{settings.counter=!settings.counter;save('baloot.settings',settings);render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden&&$('#overlay').dataset.dismiss)closeModal();if((e.key==='h'||e.key==='ه')&&$('#overlay').hidden)hint()});

/* ========= start screen ========= */
function startScreen(){
  S=newMatch();S.dealer=3;
  const demo=[{r:'J',s:'H'},{r:'9',s:'H'},{r:'A',s:'H'},{r:'A',s:'S'},{r:'10',s:'S'},{r:'K',s:'C'},{r:'Q',s:'C'},{r:'A',s:'D'}];
  S.hands=[[],demo.map(c=>({...c})),demo.map(c=>({...c})),demo.map(c=>({...c}))];
  render();
  const fan=[{r:'A',s:'S'},{r:'10',s:'H'},{r:'K',s:'C'},{r:'Q',s:'D'},{r:'J',s:'H'}].map(c=>cardHTML(c)).join('');
  openModal(`<div class="start"><div class="logo">بلوت المجلس</div><div class="sub">العب بلوت سعودي ضد بوتات تفكّر — مع خويك فهد ضد أبو سعد ومشعل</div>
    <div class="fan">${fan}</div>
    <div class="field"><span>مستوى البوتات</span><div class="seg" data-k="level">${[['easy','سهل'],['mid','متوسط'],['hard','محترف']].map(([v,l])=>`<button data-v="${v}" class="${settings.level===v?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="feat"><span>صن، حكم، أشكل، دبل</span><span>سرا، خمسين، مية، أربعمية، بلوت</span><span>تلميح من لاعب محترف</span><span>عداد ورق ذكي</span><span>آخر أكلة وسجل كامل</span><span>إحصائياتك محفوظة</span></div>
    <div class="actions"><button class="bbtn main" id="mStart" style="font-size:20px;padding:10px 34px">ابدأ اللعب</button><button class="bbtn" id="mRules">القوانين</button></div>
    <p class="stats">${stats.played?`رصيدك: ${stats.won} فوز من ${stats.played} صكة · ${stats.kaboot} كبوت`:'أول صكة لك؟ بالتوفيق!'}</p></div>`,false);
  document.querySelectorAll('.start .seg button').forEach(b=>b.onclick=()=>{settings.level=b.dataset.v;save('baloot.settings',settings);document.querySelectorAll('.start .seg button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#mStart').onclick=()=>{snd('bid');startMatch()};$('#mRules').onclick=()=>showRules(startScreen);
}
window.__baloot={startMatch,get S(){return S},settings};
startScreen();
})();
</script>
